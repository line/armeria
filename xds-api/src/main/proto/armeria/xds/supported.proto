syntax = "proto3";
package armeria.xds;

option java_package = "com.linecorp.armeria.xds.api";
option java_outer_classname = "SupportedFieldProto";
// Intentionally NOT java_multiple_files: the only message here, `supported`, is a lowercase namespacing
// holder for the option extensions (so usage reads as `(armeria.xds.supported.field)`), not a real data
// message. Emitting it with java_multiple_files would produce a non-idiomatic top-level lowercase
// `supported` class, so keep it nested under the SupportedFieldProto outer class.

import "google/protobuf/descriptor.proto";

message FieldSupport {
  int32 number = 1;
  string since = 2;
}

// Enclosing message so that option usage reads as
// `(armeria.xds.supported.field)`, `(armeria.xds.supported.oneof_field)`,
// and `(armeria.xds.supported.enum_value)`.
message supported {
  extend google.protobuf.MessageOptions {
    // Supported fields in this message.
    // Place each annotation directly above the corresponding field declaration.
    repeated FieldSupport field = 50000;
  }

  extend google.protobuf.OneofOptions {
    // Supported oneof members.
    // Place each annotation directly above the corresponding field inside a oneof block.
    repeated FieldSupport oneof_field = 50000;
  }

  extend google.protobuf.EnumOptions {
    // Supported enum values.
    repeated FieldSupport enum_value = 50000;
  }
}
