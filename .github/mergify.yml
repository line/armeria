merge_queue:
  # Do not invite contributors to queue a pull request; no queue rules are defined.
  queue_controls_comment: false

pull_request_rules:
  - name: Automatically merge Public suffix list pull requests
    conditions:
      - author=github-actions[bot]
      - title=Update public suffix list
      - files=core/src/main/resources/com/linecorp/armeria/public_suffixes.txt
    actions:
      merge:
        method: squash

  - name: Automatically merge Dependabot patch updates
    conditions:
      - author=dependabot[bot]
      - commits[*].author=dependabot[bot]
      - "#commits=1"
      - "#commits-unverified=0"
      - -from-fork
      - -draft
      - -conflict
      - base=main
      # Back-references pin the major and minor, and \Z anchors the end, so only the patch component may differ.
      - title ~= ^Bump \S+ from (\d+)\.(\d+)\.\d+ to \1\.\2\.\d+ in /(?:site|docs-client)\Z
      - -files ~= ^(?!(?:site|docs-client)/package(?:-lock)?\.json$)
      - check-success=site
      - -check-failure ~= ^build-
      - -check-pending ~= ^build-
    actions:
      merge:
        method: squash
