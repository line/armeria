name: layer1-client-cluster
type: EDS
eds_cluster_config:
  eds_config:
    path_config_source:
      path: ${config-dir}/layer1-endpoints.yaml
  service_name: layer1-endpoints
lb_subset_config:
  fallback_policy: ANY_ENDPOINT
  subset_selectors:
    - keys: ["region"]
common_lb_config:
  zone_aware_lb_config:
    routing_enabled:
      value: 100
    min_cluster_size: 1
