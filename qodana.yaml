version: "1.0"
linter: qodana-jvm
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses

disableSanityInspections: true

failureConditions:
  severityThresholds:
    critical: 0
    high: 3
    moderate: 5
