name: Update Public Suffix List
on:
  schedule:
    - cron: '0 10 * * *'

env:
  LC_ALL: "en_US.UTF-8"

jobs:
  update-psl:
    if: github.repository == 'line/armeria'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-jdk-25
        name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Update public suffix list
        run: |
          ./gradlew --no-daemon --stacktrace :core:publicSuffixes

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSWORD }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          # The title of the pull request.
          title: Update public suffix list
          commit-message: Update public suffix list
          author: Meri Kim <dl_armeria@linecorp.com>
          branch: update-public-suffixes
          committer: Meri Kim <dl_armeria@linecorp.com>
          delete-branch: true
          label: miscellaneous
          add-paths: |
            core/src/main/resources/com/linecorp/armeria/public_suffixes.txt
